 x="140" y="712" width="8" height="8" rx="0" fill="#2457E0"/><text x="140" y="790" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">8</text></g><g id="Space 16"><rect x="204" y="712" width="16" height="16" rx="0" fill="#2457E0"/><text x="204" y="790" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">16</text></g><g id="Space 24"><rect x="276" y="712" width="24" height="24" rx="0" fill="#2457E0"/><text x="276" y="790" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">24</text></g><g id="Space 32"><rect x="356" y="712" width="32" height="32" rx="0" fill="#2457E0"/><text x="356" y="790" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">32</text></g><g id="Space 48"><rect x="444" y="712" width="48" height="48" rx="0" fill="#2457E0"/><text x="444" y="790" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1A1A" text-anchor="start">48</text></g><text x="760" y="680" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A" text-anchor="start">Товч</text><g id="Button primary"><rect x="760" y="712" width="200" height="48" rx="12" fill="#2457E0"/><text x="860" y="742" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Цаг захиалах</text></g><g id="Button secondary"><rect x="984" y="712" width="200" height="48" rx="12" fill="#FFFFFF" stroke="#2457E0" stroke-width="1"/><text x="1084" y="742" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#2457E0" text-anchor="middle">Утсаар залгах</text></g><text x="760" y="800" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C5C66" text-anchor="start">Гол товч хуудсанд нэг л өнгөөр. Туслах товч зөвхөн хүрээтэй.</text>
