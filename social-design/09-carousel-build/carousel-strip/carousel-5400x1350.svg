<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="5400" height="1350" viewBox="0 0 5400 1350">
<title>Carousel кофе</title>
<rect id="bg" x="0" y="0" width="5400" height="1350" fill="#F7F1E8"/>
<circle id="cross-circle" cx="1080" cy="880" r="240" fill="#F2B33D"/>
<line id="cross-line" x1="80" y1="1180" x2="5320" y2="1180" stroke="#B4532A" stroke-width="6"/>
