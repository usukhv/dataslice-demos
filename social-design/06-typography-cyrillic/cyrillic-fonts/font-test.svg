<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Font test</title>
<rect id="bg" x="0" y="0" width="1080" height="1350" fill="#F7F1E8"/>
<g id="pair-1">
<rect x="80" y="80" width="920" height="380" rx="24" fill="#FFFFFF"/>
<text x="120" y="140" font-family="Inter" font-size="24" font-weight="400" fill="#5C534D" text-anchor="start">Inter Bold + Inter Regular</text>
<text x="120" y="250" font-family="Inter" font-size="72" font-weight="700" fill="#1F1A17" text-anchor="start">Өвлийн үнэгүй хүргэлт</text>
<text x="120" y="320" font-family="Inter" font-size="36" font-weight="400" fill="#1F1A17" text-anchor="start">Үйлчилгээ 12-р сарын 31 хүртэл</text>
<text x="120" y="400" font-family="Inter" font-size="30" font-weight="400" fill="#5C534D" text-anchor="start">Өглөөний үйлчилгээ. Үнэ 12 900₮</text>
</g>
<g id="pair-2">
<rect x="80" y="500" width="920" height="380" rx="24" fill="#FFFFFF"/>
<text x="120" y="560" font-family="Inter" font-size="24" font-weight="400" fill="#5C534D" text-anchor="start">Lora Bold + Golos Text</text>
<text x="120" y="670" font-family="Lora" font-size="72" font-weight="700" fill="#1F1A17" text-anchor="start">Өвлийн үнэгүй хүргэлт</text>
<text x="120" y="740" font-family="Golos Text" font-size="36" font-weight="400" fill="#1F1A17" text-anchor="start">Үйлчилгээ 12-р сарын 31 хүртэл</text>
<text x="120" y="820" font-family="Golos Text" font-size="30" font-weight="400" fill="#5C534D" text-anchor="start">Өглөөний үйлчилгээ. Үнэ 12 900₮</text>
</g>
<g id="pair-3">
<rect x="80" y="920" width="920" height="380" rx="24" fill="#FFFFFF"/>
<text x="120" y="980" font-family="Inter" font-size="24" font-weight="400" fill="#5C534D" text-anchor="start">Oswald Bold + Inter</text>
<text x="120" y="1090" font-family="Oswald" font-size="72" font-weight="700" fill="#1F1A17" text-anchor="start">Өвлийн үнэгүй хүргэлт</text>
<text x="120" y="1160" font-family="Inter" font-size="36" font-weight="400" fill="#1F1A17" text-anchor="start">Үйлчилгээ 12-р сарын 31 хүртэл</text>
<text x="120" y="1240" font-family="Inter" font-size="30" font-weight="400" fill="#5C534D" text-anchor="start">Өглөөний үйлчилгээ. Үнэ 12 900₮</text>
</g>
</svg>
