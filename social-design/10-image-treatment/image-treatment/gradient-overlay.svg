<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Gradient overlay</title>
<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.35" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.7"/></linearGradient></defs>
<rect id="photo" x="0" y="0" width="1080" height="1350" fill="#D9CBB8"/>
<text id="photo-label" x="540" y="500" font-family="Inter" font-size="40" font-weight="700" fill="#1F1A17" text-anchor="middle">ЗУРАГ</text>
<rect id="overlay" x="0" y="0" width="1080" height="1350" fill="url(#fade)"/>
<text id="title" x="80" y="1120" font-family="Inter" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="start">Шинэ амт</text>
<text id="subtitle" x="80" y="1190" font-family="Inter" font-size="36" font-weight="400" fill="#FFFFFF" text-anchor="start">Чацарганатай латте, өнөөдрөөс</text>
